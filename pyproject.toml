[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem-graph-icm"
version = "0.1.0"
description = "Generic AI Agent Stack unifying Interpretable Context Methodology (ICM), Graphify knowledge graphs, and Mem0 persistent memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Architecture Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "networkx>=3.2",
    "mem0ai>=0.1.0",
    "graphifyy>=0.1.0",
    "qdrant-client>=1.9.0",
    "litellm>=1.40.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mgi = "mem_graph_icm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_graph_icm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
